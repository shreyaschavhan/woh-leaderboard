<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <base href="../../">
  <title>Your training · Focus design</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="design/focus-study/focus.css">
  <script src="design/focus-study/preview.js" defer></script>
</head>
<body class="home focus-preview">
  <div id="site-preview"><p class="preview-loading">Opening your training ground…</p></div>

  <template id="focus-template">
    <section class="focus-section" id="focus-session" aria-labelledby="focus-section-title">
      <header class="focus-section-head">
        <div class="focus-section-title"><span class="focus-emblem" aria-hidden="true">✦</span><div><p class="focus-eyebrow">YOUR NEXT CHAPTER</p><h2 id="focus-section-title">Your training</h2></div></div>
        <button class="focus-garden-link" type="button" id="focus-garden">Back to the garden <span aria-hidden="true">↗</span></button>
      </header>

      <article class="focus-card" data-state="focus" aria-label="Your Focumon session">
        <div class="focus-scene" role="img" aria-label="Your trainer and Boarbox overlooking a moonlit mountain forest">
          <div class="focus-sky"></div>
          <div class="focus-starlight"></div>
          <div class="focus-moon"></div>
          <svg class="focus-landscape" viewBox="0 0 700 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
            <defs>
              <linearGradient id="focus-mist" x2="0" y2="1"><stop stop-color="#a98d73" stop-opacity=".08"/><stop offset="1" stop-color="#a98d73" stop-opacity=".42"/></linearGradient>
              <linearGradient id="focus-stone" x2="0" y2="1"><stop stop-color="#343e39"/><stop offset="1" stop-color="#192626"/></linearGradient>
              <g id="focus-pine"><path d="M-3 0H3V-90H-3Z"/><path d="M0-116 17-86H10L26-60H17L37-27H-37L-17-60H-26L-10-86H-17Z"/></g>
            </defs>
            <path fill="#3f454c" d="M0 270 45 242 66 248 143 164 176 192 199 164 226 202 286 126 302 149 323 134 400 214 460 164 479 191 517 145 562 196 594 165 700 244V500H0Z"/>
            <path fill="#5b5858" opacity=".6" d="m143 164 33 28 23-28 27 38-28-18-19 26-36-27-41 40Zm143-38 16 23 21-15 44 46-38-27-24 16-19-29-38 33Z"/>
            <path fill="#374d4a" d="M0 319 69 257 110 281 165 224 193 247 229 220 296 265 355 210 412 281 461 230 496 255 548 201 621 293 662 259 700 284V500H0Z"/>
            <path fill="url(#focus-mist)" d="M0 306Q190 255 345 284T700 292V500H0Z"/>
            <g fill="#344943"><use href="#focus-pine" transform="translate(36 366) scale(.6)"/><use href="#focus-pine" transform="translate(68 373) scale(.75)"/><use href="#focus-pine" transform="translate(107 361) scale(.58)"/><use href="#focus-pine" transform="translate(480 360) scale(.6)"/><use href="#focus-pine" transform="translate(520 351) scale(.8)"/><use href="#focus-pine" transform="translate(568 368) scale(1)"/><use href="#focus-pine" transform="translate(607 356) scale(.7)"/><use href="#focus-pine" transform="translate(644 359) scale(.85)"/></g>
            <path fill="#263e36" d="m0 403 80-38 83 9 89-41 82 12 107-34 68 32 104-21 87 24v154H0Z"/>
            <path fill="url(#focus-stone)" d="m119 377 63-17h62l28-11h99l35 11h80l32 23-18 13-9 48-22 8-16 48H170l-7-39-26-23Z"/>
            <path fill="#586951" d="m119 377 63-17h62l28-11h99l35 11h80l32 23-54 11-166-3-97 2Z"/>
            <path fill="#a8a17b" opacity=".6" d="m119 377 82 12 97-2 166 3 54-7-54 11-166-3-97 2-82-12Z"/>
            <path fill="#22332f" d="m181 405 18 7 10 72 12 16h-30l-8-43ZM393 417l25-14-8 41-24 38-7 18h-23l19-37ZM288 443l15-30 10 7-10 36-1 44h-22Z"/>
            <g fill="#8d9a6a"><path d="M182 368v-9h3v9h5v-5h3v10h-14v-5Zm299 10v-13h3v8h5v-11h3v16Z"/><path d="M245 360v-7h3v4h6v-7h3v10ZM418 366v-8h4v8h5v-5h3v9h-16v-4Z"/></g>
            <g fill="#142b26"><use href="#focus-pine" transform="translate(667 522) scale(2.9)"/><use href="#focus-pine" transform="translate(603 544) scale(1.6)"/><use href="#focus-pine" transform="translate(43 546) scale(1.8)"/></g>
            <g fill="#baab69"><path d="M147 381h4v4h-4zM480 389h3v3h-3zM226 372h3v3h-3z"/></g>
          </svg>
          <div class="focus-party"><div class="focus-ground-shadow"></div><img class="focus-trainer" src="assets/sprites/trainer-023-ed4a0f7d@4x.png" alt="" width="224" height="224"><img class="focus-companion" src="assets/sprites/focumon-181-aac27ec0@4x.png" alt="" width="224" height="224"></div>
          <div class="focus-fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="focus-party-label"><span class="focus-party-line"></span><span>SHREYAS <span class="focus-plus">+</span> BOARBOX</span><span class="focus-party-caption" id="focus-party-caption">Better, together.</span></div>
        </div>

        <div class="focus-copy">
          <div class="focus-status-line"><span class="focus-status" id="focus-status"><i></i><span>Focusing</span></span><span class="focus-sync" id="focus-sync">Updated just now</span></div>
          <h3 id="focus-headline">In your element.</h3>
          <p class="focus-description" id="focus-description">One thing at a time. Something great is taking shape.</p>
          <div class="focus-time" aria-label="24 minutes focused"><span id="focus-minutes">24</span><div class="focus-time-label"><span id="focus-unit">min</span><span id="focus-time-caption">focused this session</span></div></div>
          <div class="focus-task"><span class="focus-task-marker" aria-hidden="true"></span><div><span class="focus-task-label" id="focus-task-label">WORKING ON</span><p id="focus-task-name">Build something that matters</p></div></div>
          <div class="focus-actions"><button class="focus-primary" id="focus-primary" type="button">Open Focumon <span aria-hidden="true">↗</span></button><button class="focus-secondary" id="focus-secondary" type="button">Finish session <span aria-hidden="true">↗</span></button></div>
          <p class="focus-action-note" id="focus-action-note">Session controls open in Focumon.</p>
        </div>

        <footer class="focus-card-footer">
          <div class="focus-location"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 20 9-17 9 17ZM7 13h10M9 9h6"/></svg><div><span class="focus-task-label">TRAINING GROUND</span><span>The Goals Slayers Corp.</span></div></div>
          <div class="focus-footer-message"><span class="focus-small-spark" aria-hidden="true">✧</span><span id="focus-footer-message">Small steps. Legendary consistency.</span></div>
        </footer>
      </article>
      <p class="focus-section-note"><span aria-hidden="true">↻</span> Session status and focus minutes update from Focumon. <span>Keep this space open. Make it count.</span></p>
      <p class="sr-only" aria-live="polite" id="focus-announcement"></p>
    </section>
  </template>

  <aside class="focus-preview-tools" aria-label="Design preview controls">
    <div class="focus-preview-label"><b>DESIGN PREVIEW</b><span>Simulated session</span></div>
    <div class="focus-preview-states" role="group" aria-label="Preview session state"><button type="button" data-preview-state="idle">Ready</button><button type="button" data-preview-state="focus" aria-pressed="true">Focusing</button><button type="button" data-preview-state="break">Break</button><button type="button" data-preview-state="complete">Finished</button><button type="button" data-preview-state="stale">Offline</button></div>
    <button type="button" id="focus-preview-theme" aria-label="Switch preview theme" title="Switch preview theme">◐</button>
  </aside>

  <dialog class="focus-handoff" id="focus-handoff" aria-labelledby="handoff-title" aria-describedby="handoff-description">
    <button class="focus-dialog-close" type="button" aria-label="Close handoff preview">×</button>
    <p class="focus-eyebrow">FOCUMON HANDOFF · PREVIEW</p><span class="focus-dialog-emblem" aria-hidden="true">↗</span>
    <h2 id="handoff-title">Finish on Focumon</h2><p id="handoff-description">Your session stays active until you confirm there.</p>
    <div class="focus-handoff-recap"><span>Build something that matters</span><strong><span id="handoff-minutes">24</span> min focused</strong></div>
    <button class="focus-primary" type="button" id="handoff-confirm">Preview confirmation</button>
    <p class="focus-dialog-note">This prototype simulates the next step.<br>No real Focumon session is changed.</p>
  </dialog>
</body>
</html>
