<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stepped card frames — Before / After</title>
<style>
:root{color-scheme:light;--bg:#eee8e7;--surface:#fbf6ee;--text:#302638;--muted:#79677f;--line:#cbbbc9;--accent:#80618f}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161421;--surface:#221e31;--text:#f4eee7;--muted:#a397b0;--line:#463b53;--accent:#b9a0d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
main{max-width:1520px;margin:auto;padding:32px 24px 48px}
h1{margin:0;font-size:clamp(24px,3vw,36px);letter-spacing:-.04em}
p{color:var(--muted);margin:8px 0 24px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:24px}
.group{display:flex;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:7px}
button,select{font:inherit;color:var(--text);min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer}
.group button{border-color:transparent;background:transparent}
button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
label{display:flex;align-items:center;gap:8px}
.controls a{margin-left:auto;color:var(--text);text-underline-offset:4px}
.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
figure{margin:0;display:flex;flex-direction:column;align-items:center;min-width:0}
figcaption{width:100%;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px;font-weight:600}
figcaption span{float:right;color:var(--muted);font-weight:400;font-size:12px}
.capture{position:relative;overflow:hidden;max-width:100%}
.capture img{position:absolute;height:auto;max-width:none;display:block}
.note{margin-top:24px;font-size:12px}
@media(max-width:700px){main{padding:20px 12px}.comparison{grid-template-columns:1fr;gap:32px}.controls{gap:6px}.controls a{margin:0;width:100%}figcaption{margin-bottom:12px}}
</style>
</head>
<body>
<main>
<h1>Stepped card frames</h1>
<p>Compare corner shape and border weight with identical content.</p>
<div class="controls">
  <div class="group" role="group" aria-label="Screen size">
    <button type="button" data-device="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-device="mobile" aria-pressed="false">Mobile</button>
  </div>
  <div class="group" role="group" aria-label="Color theme">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
  </div>
  <label>View <select id="detail">
    <option value="training">Your training</option><option value="session">Session card</option><option value="context">Full context</option>
  </select></label>
  <a href="index.html">Interactive full-page preview ↗</a>
</div>
<div class="comparison">
  <figure><figcaption>Before <span>Current rounded corners</span></figcaption><div class="capture" id="before"><img alt="Current card with rounded corners"></div></figure>
  <figure><figcaption>After <span>Existing stepped frame style</span></figcaption><div class="capture" id="after"><img alt="Proposed card with stepped corners"></div></figure>
</div>
<p class="note">Sample sessions. Typography, artwork, spacing, and content positions match. Production files remain unchanged.</p>
</main>
<script>
(() => {
  const captures = {"desktop-light":{"width":1440,"height":1000,"regions":[{"height":245,"width":440,"x":122.5,"y":160},{"height":194.890625,"width":230.65625,"x":590.5,"y":200},{"height":194.890625,"width":230.671875,"x":831.15625,"y":200},{"height":194.890625,"width":230.671875,"x":1071.828125,"y":200}]},"desktop-dark":{"width":1440,"height":1000,"regions":[{"height":245,"width":440,"x":122.5,"y":160},{"height":194.890625,"width":230.65625,"x":590.5,"y":200},{"height":194.890625,"width":230.671875,"x":831.15625,"y":200},{"height":194.890625,"width":230.671875,"x":1071.828125,"y":200}]},"mobile-light":{"width":390,"height":844,"regions":[{"height":237,"width":343,"x":16,"y":70},{"height":179,"width":109.65625,"x":16,"y":451.5},{"height":179,"width":109.671875,"x":132.65625,"y":451.5},{"height":179,"width":109.65625,"x":249.328125,"y":451.5}]},"mobile-dark":{"width":390,"height":844,"regions":[{"height":237,"width":343,"x":16,"y":70},{"height":179,"width":109.65625,"x":16,"y":451.5},{"height":179,"width":109.671875,"x":132.65625,"y":451.5},{"height":179,"width":109.65625,"x":249.328125,"y":451.5}]}};
  let device = 'desktop', theme = 'light', detail = 'training';
  function render() {
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('[data-device]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.device === device)));
    document.querySelectorAll('button[data-theme]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.theme === theme)));
    const key = device + '-' + theme, capture = captures[key];
    const card = capture.regions[detail === 'session' ? 1 : 0];
    const region = detail === 'context' ? {x:0,y:0,width:capture.width,height:capture.height} :
      {x:card.x-4,y:card.y-4,width:card.width+8,height:card.height+8};
    for (const view of ['before','after']) {
      const frame = document.getElementById(view), image = frame.querySelector('img');
      frame.style.width = region.width + 'px';
      frame.style.aspectRatio = region.width + ' / ' + region.height;
      image.style.width = (capture.width / region.width * 100) + '%';
      image.style.left = (-region.x / region.width * 100) + '%';
      image.style.top = (-region.y / region.height * 100) + '%';
      image.src = key + '-' + view + '.png';
    }
  }
  document.querySelectorAll('[data-device]').forEach(button => button.addEventListener('click', () => {device=button.dataset.device;render()}));
  document.querySelectorAll('button[data-theme]').forEach(button => button.addEventListener('click', () => {theme=button.dataset.theme;render()}));
  document.getElementById('detail').addEventListener('change', event => {detail=event.target.value;render()});
  render();
})();
</script>
</body>
</html>
